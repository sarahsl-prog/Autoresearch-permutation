[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
# Upper bound is torch.compile, not the wheels: torch 2.9.1 publishes cp314
# wheels, but its check_if_dynamo_supported() raises on Python 3.14+, and this
# training loop compiles the model and both optimizer steps with fullgraph=True.
# Better to fail at resolution than at runtime.
requires-python = ">=3.10,<3.14"
dependencies = [
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "mlflow>=3.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
